name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run interrogate
      - run: uv run pytest -q

  smoke:
    name: API smoke test (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Demo API, agents and mock alert
        env:
          DEMO_MODE: "1"
        run: |
          # Run from .venv directly: a background `uv run` keeps the uv cache locked.
          .venv/bin/uvicorn src.dashboard.api:app --port 8000 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for i in $(seq 30); do curl -sf localhost:8000/api/scenes && break; sleep 1; done
          curl -sf localhost:8000/api/scenes | grep -q demo_incident
          curl -sf localhost:8000/api/decision/demo_incident | grep -q '"is_incident":true'
          curl -sf -X POST localhost:8000/api/alert -H 'Content-Type: application/json' \
            -d '{"scene":"demo_incident","frame":70,"score":2.1}' | grep -q '"mock":true'
